<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Elevate Automation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    /* SPA fallback: send any unknown path into the hash-routed app */
    (function () {
      var p = window.location.pathname.replace(/^\//, '');
      var hash = window.location.hash || (p ? '#/' + p : '');
      window.location.replace('/' + hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/" />
</head>
<body></body>
</html>
