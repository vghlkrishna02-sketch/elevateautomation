<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="Elevate Automation logo">
  <defs>
    <linearGradient id="eaE" x1="7" y1="34" x2="30" y2="7" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E4FC4"/>
      <stop offset="1" stop-color="#2E7BE6"/>
    </linearGradient>
    <linearGradient id="eaArrow" x1="14" y1="26" x2="35" y2="7" gradientUnits="userSpaceOnUse">
